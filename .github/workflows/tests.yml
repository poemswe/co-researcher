name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: python -m pip install pytest 'pymupdf4llm<2' python-dotenv 'bibtexparser>=1.4,<2'

      - name: Run unit tests
        run: python -m pytest -q tests

      - name: Run literature integrity smoke and adversarial tests
        run: |
          python -m pytest -q \
            tests/test_research_smoke.py \
            tests/test_literature_integrity_attacks.py \
            tests/test_literature_integrity_separation.py

      - name: Run claim-verification evaluations
        run: python -m pytest -q tests/eval_check_claims.py

      - name: Run claim-verifier benchmark protocol-core tests
        run: |
          python -m pip install uv==0.10.9
          uv sync --project evals/claim-verifier-benchmark --locked
          uv run --project evals/claim-verifier-benchmark pytest \
            evals/claim-verifier-benchmark/tests -q
          uv run --project evals/claim-verifier-benchmark \
            claim-benchmark-core check-split-vector \
            evals/claim-verifier-benchmark/fixtures/split-vector.json
